[project]
name = "ariadne"
version = "0.1.0"
description = "Turn a codebase into a 3D map you can explore."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
# Syntax trees for the function x-ray, gates and states (ariadne_xray / ariadne_gates).
dependencies = ["tree-sitter-language-pack"]

[project.scripts]
ariadne = "ariadne:main"

[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

# The repo stays a single script plus the viewer folder; the wheel packs them as one package.
[tool.hatch.build.targets.wheel]
bypass-selection = true

[tool.hatch.build.targets.wheel.force-include]
"ariadne.py" = "ariadne/__init__.py"
"SCHEMA.md" = "ariadne/SCHEMA.md"
"viewer" = "ariadne/viewer"
"ariadne_xray.py" = "ariadne_xray.py"
"ariadne_gates.py" = "ariadne_gates.py"
